[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/respostas/:id/conversao"
  to = "/.netlify/functions/conversao?id=:id"
  status = 200

[[redirects]]
  from = "/api/respostas"
  to = "/.netlify/functions/respostas"
  status = 200

[[redirects]]
  from = "/api/compartilhamentos/:ref/visita"
  to = "/.netlify/functions/compartilhamentos?ref=:ref&acao=visita"
  status = 200

[[redirects]]
  from = "/api/compartilhamentos"
  to = "/.netlify/functions/compartilhamentos"
  status = 200

[[redirects]]
  from = "/api/eventos"
  to = "/.netlify/functions/eventos"
  status = 200

[[redirects]]
  from = "/api/estatisticas"
  to = "/.netlify/functions/estatisticas"
  status = 200
